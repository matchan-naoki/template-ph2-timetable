# POSSE大学 時間割アプリの開発環境
#   web     : nginx（ブラウザからのリクエストを受ける）
#   app     : PHP-FPM（Laravel を動かす）
#   db      : PostgreSQL（授業データを保存する）
#   mailpit : テストメールを受信する

services:
  web:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build: ./docker/php
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: timetable
      POSTGRES_USER: posse
      POSTGRES_PASSWORD: password
      TZ: Asia/Tokyo
    volumes:
      # データを残すための名前付きボリューム
      - db-data:/var/lib/postgresql
      # 初回起動時だけSQLを実行
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  # Week11で追加
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    expose:
      - "1025"

volumes:
  db-data: